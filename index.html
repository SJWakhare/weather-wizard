<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Wizard</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Font  -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Basic Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- Filled Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"
      rel="stylesheet"
    />
    <!-- Brand Icons -->
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="search-box">
        <i class="bx bx-location-alt-2"></i>
        <input type="text" placeholder="Enter your location" />
        <button class="bx bx-search-alt"></button>
      </div>

      <p class="city-hide">city hide</p>

      <div class="weather-box">
        <div class="box">
          <div class="info-weather">
            <div class="weather">
              <img src="images/Cloudy.png" alt="Expect sunny weather and clear skies">
              <p class="temperature">0<sup>&deg;c</sup></p>
              <p class="description">Broken Clouds</p>
            </div>
          </div>
        </div>
      </div>

      <div class="weather-details">
        <div class="humidity">
            <i class="bx bx-water-drop"></i>
            <div class="text">
              <div class="info-humidity">
                <span>0%</span>
              </div>
              <p>Humidity</p>
            </div>
        </div>

        <div class="wind">
            <i class="bx bx-wind"></i>
            <div class="text">
              <div class="info-wind">
                <span>0 km/h</span>
              </div>
              <p>Wind Speed</p>
            </div>
        </div>
      </div>

      <div class="not-found">
        <div class="box">
          <img src="images/404.png" alt="Location not found">
          <p>Oops! Location not found!</p>
        </div>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
